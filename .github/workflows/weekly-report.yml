name: Weekly riskiest-packages report
on:
  schedule:
    - cron: '0 9 * * 1' # Mondays 09:00 UTC
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r weekly-report/requirements.txt

      - name: Generate report
        env:
          PACKAGESAFE_API_URL: ${{ secrets.PACKAGESAFE_API_URL }}
        run: python weekly-report/generate.py

      - name: Commit generated report
        run: |
          git config user.name "packagesafe-bot"
          git config user.email "bot@packagesafe.dev"
          git add web/content/reports
          git diff --cached --quiet || git commit -m "chore: weekly riskiest-packages report"
          git push
